# =========================================================
# VANY LIGHTS — Configuración de Netlify
# Netlify lee este archivo cada vez que publica el sitio.
# =========================================================

[build]
  # Es un sitio estático (HTML, CSS y JS): no hay que "construir" nada.
  # La carpeta que se publica es la raíz del proyecto.
  publish = "."
  command = ""

# Las imágenes, la librería GSAP y las fuentes casi nunca cambian:
# le decimos al navegador que las guarde por un año (más velocidad en Lighthouse).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS y JS sí cambian cuando hacemos commits: el navegador los revisa en cada visita.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cabeceras básicas de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"